apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps-gateway
  namespace: servicemesh-apps
  annotations:
    # Istio creates the Service "apps-gateway-istio" for this Gateway. Use ClusterIP
    # instead of the default LoadBalancer and expose it with an OpenShift Route.
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: default
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: apps-gateway
  namespace: servicemesh-apps
spec:
  to:
    kind: Service
    name: apps-gateway-istio
    weight: 100
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
