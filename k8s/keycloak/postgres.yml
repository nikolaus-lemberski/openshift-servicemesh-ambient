apiVersion: v1
kind: Secret
metadata:
  name: keycloak-pgsql-user
  namespace: servicemesh-keycloak
stringData:
  user: keycloak
  password: ${KEYCLOAK_DB_PASSWORD}
  dbname: keycloak
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-pgsql-data
  namespace: servicemesh-keycloak
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-pgsql
  namespace: servicemesh-keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-pgsql
  template:
    metadata:
      labels:
        app: keycloak-pgsql
    spec:
      containers:
      - name: pgsql
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: keycloak-pgsql-user
              key: user
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-pgsql-user
              key: password
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: keycloak-pgsql-user
              key: dbname
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: pgsql-storage
          mountPath: /var/lib/pgsql/data
      volumes:
      - name: pgsql-storage
        persistentVolumeClaim:
          claimName: keycloak-pgsql-data
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-pgsql
  namespace: servicemesh-keycloak
spec:
  selector:
    app: keycloak-pgsql
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
