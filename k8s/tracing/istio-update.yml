apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  version: v1.30-latest
  profile: ambient
  values:
    # global:
    #   nativeNftables: true  # required on RHEL 10 / RHCOS 10 nodes
    pilot:
      trustedZtunnelNamespace: ztunnel
    meshConfig:
      enableTracing: true
      defaultProviders:
        metrics:
          - prometheus
        tracing:
          - otel
      extensionProviders:
      - name: otel
        opentelemetry:
          port: 4317
          service: otel-collector.tempostack.svc.cluster.local
      discoverySelectors:
      - matchLabels:
          istio-discovery: enabled
